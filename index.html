<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GNR mobile Shop </title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <i class="fas fa-tools"></i>
        <span>RepairFlow</span>
      </div>
      <nav class="sidebar-nav">
        <a href="#" class="nav-item active" data-page="dashboard"><i class="fas fa-th-large"></i> Dashboard</a>
        <a href="#" class="nav-item" data-page="customers"><i class="fas fa-users"></i> Customers</a>
        <a href="#" class="nav-item" data-page="add-repair"><i class="fas fa-plus-circle"></i> New Repair</a>
        <a href="#" class="nav-item" data-page="bill"><i class="fas fa-file-invoice"></i> Bill</a>
        <a href="settings.html" class="nav-item"><i class="fas fa-cog"></i> Settings</a>
      </nav>
    </aside>

    <main class="main-content">
      <!-- Dashboard -->
      <section id="dashboardPage" class="page active">
        <h1>Dashboard</h1>
        <div class="stats-grid" id="statsGrid"></div>
        <div class="recent-section">
          <h2>Recent Repairs</h2>
          <table id="recentTable">
            <thead><tr><th>Customer</th><th>Model</th><th>Problem</th><th>Status</th><th>Cost</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <!-- Customers -->
      <section id="customersPage" class="page">
        <h1>Customers</h1>
        <div class="toolbar">
          <input type="text" id="searchInput" placeholder="Search name, phone, IMEI, model..." autocomplete="off">
          <select id="filterStatus">
            <option value="">All Status</option>
            <option value="Pending">Pending</option>
            <option value="In Progress">In Progress</option>
            <option value="Ready">Ready for Delivery</option>
            <option value="Completed">Completed</option>
          </select>
          <select id="sortBy">
            <option value="date">Sort by Date</option>
            <option value="cost">Sort by Cost</option>
            <option value="status">Sort by Status</option>
          </select>
          <button class="btn btn-primary" onclick="exportJSON()"><i class="fas fa-download"></i> Export</button>
        </div>
        <div class="table-responsive">
          <table id="customerTable">
            <thead><tr><th>Name</th><th>Phone</th><th>Model</th><th>IMEI</th><th>Problem</th><th>Cost</th><th>Status</th><th>Due</th><th>Actions</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <!-- Add / Edit Repair -->
      <section id="addRepairPage" class="page">
        <h1 id="formTitle">New Repair</h1>
        <form id="repairForm" class="repair-form">
          <input type="hidden" id="editId">
          <div class="form-row">
            <div class="form-group"><label>Customer Name *</label><input type="text" id="custName" required></div>
            <div class="form-group"><label>Phone *</label><input type="tel" id="custPhone" required></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Brand</label><input type="text" id="custBrand"></div>
            <div class="form-group"><label>Model</label><input type="text" id="custModel"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>IMEI</label><input type="text" id="custIMEI"></div>
            <div class="form-group"><label>Cost (₹)</label><input type="number" id="repairCost" min="0" required></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Advance</label><input type="number" id="advancePaid" min="0" value="0"></div>
            <div class="form-group"><label>Status</label><select id="repairStatus"><option>Pending</option><option>In Progress</option><option>Ready</option><option>Completed</option></select></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Date Received</label><input type="date" id="dateReceived"></div>
            <div class="form-group"><label>Expected Delivery</label><input type="date" id="expectedDelivery"></div>
          </div>
          <div class="form-group"><label>Problem Description</label><textarea id="problemDesc" rows="3" required></textarea></div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save</button>
            <button type="button" class="btn btn-secondary" onclick="cancelEdit()">Cancel</button>
          </div>
          <div id="formFeedback" class="feedback-message"></div>
        </form>
      </section>

      <!-- Bill -->
      <section id="billPage" class="page">
        <h1>Generate Bill</h1>
        <div class="form-card">
          <div class="form-group"><label>Select Customer</label><select id="billCustomerSelect"><option value="">-- Choose --</option></select></div>
          <button class="btn btn-primary" onclick="generateBill()"><i class="fas fa-file-invoice"></i> Show Bill</button>
        </div>
        <div id="billContainer" class="bill-card hidden"><div id="billContent"></div><div class="no-print"><button class="btn btn-primary" onclick="window.print()"><i class="fas fa-print"></i> Print</button></div></div>
      </section>

      <!-- Timeline & Notes Modal -->
      <div id="detailsModal" class="modal hidden">
        <div class="modal-content">
          <span class="close-btn" onclick="closeDetailsModal()">&times;</span>
          <div class="detail-tabs">
            <button class="tab active" onclick="switchTab('timeline')">Timeline</button>
            <button class="tab" onclick="switchTab('notes')">Technician Notes</button>
            <button class="tab" onclick="switchTab('loyalty')">Loyalty</button>
          </div>
          <div id="tabTimeline" class="tab-content active"></div>
          <div id="tabNotes" class="tab-content">
            <textarea id="newNote" rows="3" placeholder="Add a note..."></textarea>
            <button class="btn btn-primary" onclick="addNote()">Add Note</button>
            <div id="notesList"></div>
          </div>
          <div id="tabLoyalty" class="tab-content"></div>
        </div>
      </div>

      <!-- Job Sheet Modal -->
      <div id="jobSheetModal" class="modal hidden">
        <div class="modal-content">
          <span class="close-btn" onclick="closeJobSheet()">&times;</span>
          <div id="jobSheetContent"></div>
          <div class="no-print"><button class="btn btn-primary" onclick="window.print()"><i class="fas fa-print"></i> Print</button></div>
        </div>
      </div>
    </main>
  </div>

  <footer class="app-footer"><p>&copy; 2026 GNR CloudPC sofrware Solutions. Built for real shops.</p></footer>

  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
